<!-- Main Navbar -->
<nav class="navbar-main" [class.scrolled]="isScrolled">
  <div class="container-custom navbar-content">
    <!-- Logo -->
    <a routerLink="/home" class="logo">
      <span class="logo-text">ALKAPONE</span>
      <span class="logo-dot">.</span>
    </a>

    <!-- Navigation Links -->
    <ul class="nav-links">
      <li><a routerLink="/home" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">Inicio</a></li>
      <li><a routerLink="/ropa" routerLinkActive="active">Ropa</a></li>
      <li><a routerLink="/gorras" routerLinkActive="active">Gorras</a></li>
      <li><a routerLink="/accesorios" routerLinkActive="active">Accesorios</a></li>
    </ul>

    <!-- Actions -->
    <div class="nav-actions">
      <!-- Search -->
      <button class="nav-icon" (click)="toggleSearch()" title="Buscar">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      </button>
      <!-- Favorites -->
      <button class="nav-icon" title="Favoritos">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>
      </button>
      <!-- Cart -->
      <button class="nav-icon cart-btn" title="Carrito" routerLink="/carrito">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"/></svg>
        <span class="cart-badge">0</span>
      </button>
      <!-- User -->
      <button class="nav-icon" (click)="goToAuth()" [title]="clienteLogueado ? 'Mi cuenta' : 'Iniciar sesión'">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      </button>
    </div>

    <!-- Mobile Menu Toggle -->
    <button class="mobile-toggle" (click)="toggleMenu()">
      <span [class.open]="menuOpen"></span>
    </button>
  </div>

  <!-- Search Bar -->
  <div class="search-bar" [class.open]="searchOpen">
    <div class="container-custom search-bar-content">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      <input type="text" placeholder="Buscar productos..." [(ngModel)]="searchTerm" (keyup.enter)="search()" autofocus>
      <button class="search-close" (click)="toggleSearch()">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
      </button>
    </div>
  </div>

  <!-- Mobile Menu -->
  <div class="mobile-menu" [class.open]="menuOpen">
    <a routerLink="/home" routerLinkActive="active" (click)="toggleMenu()">Inicio</a>
    <a routerLink="/ropa" routerLinkActive="active" (click)="toggleMenu()">Ropa</a>
    <a routerLink="/gorras" routerLinkActive="active" (click)="toggleMenu()">Gorras</a>
    <a routerLink="/accesorios" routerLinkActive="active" (click)="toggleMenu()">Accesorios</a>
    <a routerLink="/carrito" (click)="toggleMenu()">Carrito</a>
    <a routerLink="/auth" (click)="toggleMenu()" *ngIf="!clienteLogueado">Iniciar sesión</a>
    <a (click)="logout(); toggleMenu()" *ngIf="clienteLogueado">Cerrar sesión ({{ clienteLogueado.Nombre }})</a>
  </div>
</nav>
