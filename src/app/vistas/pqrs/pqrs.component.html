<section class="pqrs-page">
  <div class="pqrs-hero">
    <h1>PQRS</h1>
    <p>Peticiones, quejas, reclamos y sugerencias</p>
  </div>
  <div class="pqrs-box">
    <label>Tipo de solicitud</label>
    <select #t (change)="tipo = t.value">
      <option value="Peticion">Petición</option>
      <option value="Queja">Queja</option>
      <option value="Reclamo">Reclamo</option>
      <option value="Sugerencia">Sugerencia</option>
    </select>
    <label>Cuéntanos qué pasó</label>
    <textarea #d rows="6" [value]="descripcion" (input)="descripcion = d.value" placeholder="Escribe aquí tu mensaje..."></textarea>
    <button (click)="enviar()" [disabled]="enviando">{{ enviando ? 'Enviando...' : 'Enviar' }}</button>
  </div>
</section>
