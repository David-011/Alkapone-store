<section class="catalog-page">
  <div class="page-header">
    <div class="container-custom">
      <h1>Gorras</h1>
      <p>Completa tu look con nuestras gorras exclusivas</p>
    </div>
  </div>

  <div class="container-custom">
    <div class="toolbar">
      <div class="toolbar-left">
        <span class="results-count">{{ filteredProducts.length }} productos</span>
      </div>
      <div class="toolbar-right">
        <div class="search-box">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
          <input type="text" placeholder="Buscar gorra..." [(ngModel)]="searchTerm" (input)="filterProducts()">
        </div>
        <select [(ngModel)]="sortOption" (change)="sortProducts()">
          <option value="recent">Más recientes</option>
          <option value="price-low">Menor precio</option>
          <option value="price-high">Mayor precio</option>
          <option value="name">Nombre A-Z</option>
        </select>
      </div>
    </div>

    <div class="products-grid" *ngIf="!isLoading">
      <div class="product-card" *ngFor="let product of filteredProducts">
        <div class="product-image">
          <div class="product-tag" *ngIf="product.stock < 5">Últimas unidades</div>
          <button class="product-fav">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>
          </button>
        </div>
        <div class="product-info">
          <span class="product-category">{{ product.categoria }}</span>
          <h4 class="product-name">{{ product.nombre }}</h4>
          <p class="product-desc">{{ product.descripcion }}</p>
          <div class="product-bottom">
            <p class="product-price">{{ formatPrice(product.precio) }}</p>
            <button class="btn-add-cart">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"/></svg>
              Agregar
            </button>
          </div>
        </div>
      </div>
    </div>

    <div class="loading" *ngIf="isLoading">
      <div class="spinner"></div>
      <p>Cargando productos...</p>
    </div>

    <div class="empty-state" *ngIf="!isLoading && filteredProducts.length === 0">
      <p>No se encontraron productos</p>
    </div>
  </div>
</section>
