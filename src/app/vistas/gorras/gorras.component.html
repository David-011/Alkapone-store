<section class="catalog-page">
  <div class="catalog-hero">
    <h1>GORRAS</h1>
    <p>Completa tu look con nuestras gorras exclusivas</p>
  </div>
  <div class="container-custom catalog-content">
    <div class="catalog-controls">
      <input type="text" placeholder="Buscar gorra..." [(ngModel)]="searchTerm" (input)="filterProducts()">
      <span class="product-count">{{ filteredProducts.length }} productos</span>
      <select [(ngModel)]="sortOrder" (change)="sortProducts()">
        <option value="default">Ordenar por</option>
        <option value="asc">Menor precio</option>
        <option value="desc">Mayor precio</option>
      </select>
    </div>
    <div class="product-grid" *ngIf="!isLoading">
      <div class="product-card" *ngFor="let product of filteredProducts">
        <div class="product-image">
          <img [src]="product.imagen" [alt]="product.nombre" class="product-img">
        </div>
        <div class="product-info">
          <span class="product-category">{{ product.categoria }}</span>
          <h3 class="product-name">{{ product.nombre }}</h3>
          <span class="product-price">{{ formatPrice(product.precio) }}</span>
          <button class="btn-add-cart" (click)="addToCart(product)">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"/></svg>
            Agregar al carrito
          </button>
        </div>
      </div>
    </div>
    <div class="loading" *ngIf="isLoading">Cargando productos...</div>
    <div class="no-products" *ngIf="!isLoading && filteredProducts.length === 0">No se encontraron productos</div>
  </div>
</section>
